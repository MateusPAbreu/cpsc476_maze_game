    // speech text for screen narration
    const messageText = "Press Play to enter the maze. Press Tutorial to learn how. Press Credits to see who made the game.";
    let repeatInterval;

    // read the message aloud
    function speakMessage() {
      const u = new SpeechSynthesisUtterance(messageText);
      u.lang = "en-US"; u.pitch = 1.1; u.rate = 1; u.volume = 1;
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes("Google US English") || v.name.includes("Microsoft Zira") || v.name.includes("Samantha") || v.name.includes("Jenny"));
      if (preferred) u.voice = preferred;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }

    // start and repeat narration
    function initSpeech() {
      if (speechSynthesis.getVoices().length === 0) speechSynthesis.addEventListener("voiceschanged", speakMessage);
      else speakMessage();
      if (repeatInterval) clearInterval(repeatInterval);
      repeatInterval = setInterval(() => speakMessage(), 10000);
    }

    // wait until page ready then speak
    document.addEventListener("DOMContentLoaded", () => { initSpeech(); });

    // enable narration on first user action
