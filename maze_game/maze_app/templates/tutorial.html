{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Math Maze – Tutorial</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #121212;
            color: #fff;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        h1 {
            color: #ffcc00;
            text-shadow: 2px 2px #ff6600;
            margin-bottom: 15px;
        }

        .game-container {
            position: relative;
            width: 90vw;
            height: 85vh;
            background: #1e1e1e;
            border: 4px solid #ffcc00;
            border-radius: 15px;
            box-shadow: 0 0 25px #ff6600;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        
        .tutorial-video {
            width: 100%;
            height: 100%;
            object-fit: fill; 
            border-radius: 12px;
            display: block;
            background: #000;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(145deg,#ff6600,#ffcc00);
            color: white;
            border: none;
            font-size: 1.2em;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #cc5200;
            transition: transform .2s ease, box-shadow .2s ease;
            z-index: 10;
        }

            .back-btn:hover {
                transform: translateY(-3px);
                box-shadow: 0 8px 0 #cc5200;
            }

            .back-btn:active {
                transform: translateY(3px);
                box-shadow: 0 3px 0 #cc5200;
            }
    </style>
</head>
<body>
    <button class="back-btn" id="backBtn">← Back</button>
    <h1>The Math Maze – Tutorial</h1>

    <div class="game-container">
  
        <video class="tutorial-video" id="tutorialVideo" controls>
            <source src="{% static 'maze_tutorial.mp4' %}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <script>
        const tutorialMessage =
            " At the top left of the screen, " +
            "it shows whose turn it is. The map key on the top right explains " +
            "what everything means including their symbols. Roll the dice to see how many moves you have. " +
            "Use the arrow keys to move. When you reach a door, answer the question. " +
            "A correct answer lets you pass. A wrong answer loses a move. " +
            "Player one goes first, then player two, then the A I. " +
            "The game ends when someone reaches the end door.";

        const video = document.getElementById("tutorialVideo");
        let tutorialUtterance = null;

        function createUtterance() {
            if (!("speechSynthesis" in window)) return null;

            const u = new SpeechSynthesisUtterance(tutorialMessage);
            u.lang = "en-US";
            u.pitch = 1.2;
            u.rate = 1;
            u.volume = 1;

            const voices = speechSynthesis.getVoices();
            const preferred = voices.find(v =>
                v.name.includes("Google US English") ||
                v.name.includes("Microsoft Zira") ||
                v.name.includes("Samantha") ||
                v.name.includes("Jenny")
            );
            if (preferred) u.voice = preferred;

            u.onend = () => {
                // reset when done so replaying the video can restart narration
                tutorialUtterance = null;
            };

            return u;
        }

        function startOrResumeNarration() {
            if (!("speechSynthesis" in window)) return;

            // If currently paused, just resume
            if (speechSynthesis.paused && tutorialUtterance) {
                speechSynthesis.resume();
                return;
            }

            // If already speaking, do nothing
            if (speechSynthesis.speaking) return;

            // If voices not loaded yet, wait for them once
            if (speechSynthesis.getVoices().length === 0 && !tutorialUtterance) {
                const handler = () => {
                    speechSynthesis.removeEventListener("voiceschanged", handler);
                    tutorialUtterance = createUtterance();
                    if (tutorialUtterance) speechSynthesis.speak(tutorialUtterance);
                };
                speechSynthesis.addEventListener("voiceschanged", handler, { once: true });
                return;
            }

            if (!tutorialUtterance) {
                tutorialUtterance = createUtterance();
            }
            if (tutorialUtterance) {
                speechSynthesis.cancel();
                speechSynthesis.speak(tutorialUtterance);
            }
        }

        function pauseNarration() {
            if (!("speechSynthesis" in window)) return;
            if (speechSynthesis.speaking && !speechSynthesis.paused) {
                speechSynthesis.pause();
            }
        }

        function stopNarration() {
            if (!("speechSynthesis" in window)) return;
            speechSynthesis.cancel();
            tutorialUtterance = null;
        }

        // Tie narration to video controls
        video.addEventListener("play", () => {
            startOrResumeNarration();
        });

        video.addEventListener("pause", () => {
            pauseNarration();
        });

        video.addEventListener("ended", () => {
            stopNarration();
        });

        document.getElementById("backBtn").addEventListener("click", () => {
            stopNarration();
            window.location.href = "{% url 'options' %}";
        });
    </script>
</body>
</html>
