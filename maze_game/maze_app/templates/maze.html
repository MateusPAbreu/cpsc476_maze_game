{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Math Maze - Level</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #0e2d14;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }

        h1 {
            color: #ffd166;
            text-shadow: 2px 2px #2d6a4f;
            margin-bottom: 5px;
        }

        .turn-indicator {
            margin-bottom: 5px;
            font-size: 1.8em;
            color: #b7f397;
            font-weight: bold;
            align-self: flex-start;
            margin-left: 250px;
        }

        .dice-container {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .dice-row {
            display: flex;
            gap: 15px;
            margin-top: 5px;
            align-items: center;
            justify-content: center;
        }

        .dice {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            background: white;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            box-shadow: 0 0 10px #000;
            transition: transform 0.2s ease;
        }

        .moves-wrapper {
            position: absolute;
            top: 2px;
            right: -110px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .moves-title {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 4px;
            color: #facc15;
            text-shadow: 1px 1px #000;
        }

        .moves-box {
            width: 80px;
            height: 80px;
            border-radius: 14px;
            background: #0f172a;
            color: #facc15;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2em;
            font-weight: bold;
            box-shadow: 0 0 10px #000;
        }

        .roll-btn {
            background: linear-gradient(145deg,#40916c,#95d5b2);
            border: none;
            color: white;
            font-size: 1.2em;
            padding: 8px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 0 #1b4332;
            transition: transform 0.2s;
        }

            .roll-btn:active {
                transform: translateY(3px);
                box-shadow: 0 2px 0 #1b4332;
            }

        .game-container {
            position: relative;
            width: 90vw;
            height: 85vh;
            background-color: #1b4332;
            border: 4px solid #74c69d;
            border-radius: 15px;
            box-shadow: 0 0 25px #40916c;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        canvas {
            width: 95%;
            height: 90%;
            background: linear-gradient(180deg,#144d28,#0b3316);
            border-radius: 10px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: linear-gradient(145deg,#40916c,#95d5b2);
            color: white;
            border: none;
            font-size: 1.2em;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 0 #1b4332;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            z-index: 10;
        }

        .legend {
            position: absolute;
            right: 10px;
            top: 10px;
            background: #0f3b23;
            padding: 10px 16px;
            border-radius: 12px;
            border: 3px solid #74c69d;
            box-shadow: 0 0 12px #000;
            color: white;
            width: 190px;
            font-size: 0.9em;
            z-index: 15;
        }

        .legend-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            font-weight: bold;
            color: #ffd166;
        }

            .legend-header span.icon {
                font-size: 1.1em;
                margin-right: 6px;
            }

            .legend-header span.arrow {
                font-size: 1.1em;
            }

        .legend-body {
            margin-top: 8px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .legend-box {
            width: 22px;
            height: 22px;
            display: inline-block;
            margin-right: 8px;
            border-radius: 4px;
            border: 1px solid #fff3;
        }

        .legend-circle {
            width: 18px;
            height: 18px;
            display: inline-block;
            margin-right: 8px;
            border-radius: 50%;
            border: 1px solid #fff3;
        }

        .legend.collapsed .legend-body {
            display: none;
        }

        .door-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

            .door-modal.hidden {
                display: none;
            }

        .door-modal-content {
            background: #111827;
            border-radius: 18px;
            padding: 24px 32px;
            min-width: 420px;
            max-width: 520px;
            box-shadow: 0 0 25px #000;
            border: 3px solid #4ade80;
            text-align: center;
        }

        .door-question-text {
            font-size: 2.4rem;
            margin-bottom: 16px;
        }

        .door-input {
            width: 60%;
            padding: 8px 10px;
            border-radius: 10px;
            border: none;
            font-size: 1.4rem;
            text-align: center;
            outline: none;
        }

        .door-feedback {
            min-height: 24px;
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .door-submit-btn {
            margin-top: 16px;
            padding: 8px 22px;
            font-size: 1.2rem;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            background: linear-gradient(145deg,#22c55e,#86efac);
            color: #052e16;
            box-shadow: 0 4px 0 #166534;
        }

            .door-submit-btn:active {
                transform: translateY(2px);
                box-shadow: 0 2px 0 #166534;
            }
    </style>
</head>
<body>
    <h1>The Math Maze - Level</h1>
    <div class="turn-indicator" id="turnText">Turn: Player 1 🟡</div>

    <div class="dice-container">
        <button class="roll-btn" id="rollButton">🎲 Roll Dice</button>

        <div class="dice-row">
            <div class="dice" id="dice1">-</div>
            <div class="dice" id="dice2">-</div>
        </div>

        <div class="moves-wrapper">
            <div class="moves-title">Moves Left</div>
            <div class="moves-box" id="movesBox">0</div>
        </div>
    </div>

    <button class="back-btn" onclick="window.location.href='{% url 'options' %}'">← Back</button>

    <div class="game-container">
        <canvas id="mazeCanvas" width="800" height="600"></canvas>
    </div>

    <div id="doorModal" class="door-modal hidden">
        <div class="door-modal-content">
            <div id="doorQuestionText" class="door-question-text">7 × 4 = ?</div>
            <input id="doorAnswerInput" class="door-input" type="number" autocomplete="off" />
            <div id="doorFeedback" class="door-feedback"></div>
            <button id="doorSubmitBtn" class="door-submit-btn">Submit</button>
        </div>
    </div>

    <audio id="bgMusic" src="{% static 'audio/mazemusic.mp3' %}" loop></audio>

    <div class="legend collapsed" id="legend">
        <div class="legend-header" id="legendHeader">
            <span><span class="icon">🗺️</span>Map Key</span>
            <span class="arrow" id="legendArrow">▼</span>
        </div>

        <div class="legend-body" id="legendBody">
            <div class="legend-item">
                <span class="legend-box" style="background:#4ade80;"></span> Start Tile
            </div>
            <div class="legend-item">
                <span class="legend-box" style="background:#0ea5e9;"></span> End Tile
            </div>
            <div class="legend-item">
                <span class="legend-circle" style="background:#fde047;"></span> Player 1
            </div>
            <div class="legend-item">
                <span class="legend-circle" style="background:#38bdf8;"></span> Player 2
            </div>
            <div class="legend-item">
                <span class="legend-circle" style="background:#9d4edd;"></span> AI
            </div>
            <div class="legend-item">
                <span class="legend-box" style="background:#9A3412;"></span> Locked Door
            </div>
            <div class="legend-item">
                <span class="legend-box" style="background:#22C55E;"></span> Unlocked Door
            </div>
            <div class="legend-item">
                <span class="legend-box" style="background:#145214;"></span> Maze Wall
            </div>
            <div class="legend-item">
                <span class="legend-box" style="background:#A7E074;"></span> Path
            </div>
        </div>
    </div>

    <script>
        const bgMusic = document.getElementById("bgMusic");

        /* ========= SESSION + LOGGING HELPERS ========= */

        const GAME_SESSION_ID = {{ game_session_id|default:"null" }};
        const GAME_LEVEL = {{ level|default:"1" }};

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const CSRF_TOKEN = getCookie("csrftoken");

        function sendGameUpdate(payload) {
            if (!GAME_SESSION_ID) return;
            fetch(`/api/game/${GAME_SESSION_ID}/update/`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": CSRF_TOKEN,
                },
                body: JSON.stringify(payload),
            }).catch((err) => {
                console.error("Game update failed:", err);
            });
        }

        /* ========= GAME SETUP ========= */

        const levelSelection = parseInt(localStorage.getItem("levelSelection") || "1", 10);

        const levelConfig = {
            1: { doors: 7,  maxDigit: 10 },
            2: { doors: 9,  maxDigit: 20 },
            3: { doors: 12, maxDigit: 40 },
            4: { doors: 16, maxDigit: 60 },
            5: { doors: 21, maxDigit: 100 }
        };

        const currentConfig = levelConfig[levelSelection] || levelConfig[1];
        let doorCount = currentConfig.doors;
        const maxDigit = currentConfig.maxDigit;

        document.querySelector("h1").textContent = `The Math Maze - Level ${levelSelection}`;
        document.title = `The Math Maze - Level ${levelSelection}`;

        function startMusic() {
            if (!bgMusic) return;
            bgMusic.volume = 0.4;
            bgMusic.play().catch(() => {});
        }

        const unlockMusic = () => {
            startMusic();
            window.removeEventListener("click", unlockMusic);
            window.removeEventListener("keydown", unlockMusic);
            window.removeEventListener("mousemove", unlockMusic);
        };

        document.addEventListener("DOMContentLoaded", () => {
            window.addEventListener("click", unlockMusic);
            window.addEventListener("keydown", unlockMusic);
            window.addEventListener("mousemove", unlockMusic);
        });

        function speak(text) {
            if (!("speechSynthesis" in window)) return;
            const utter = new SpeechSynthesisUtterance(text);
            utter.rate = 1;
            utter.pitch = 1;
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utter);
        }

        const canvas = document.getElementById("mazeCanvas"), ctx = canvas.getContext("2d");
        const rows = 15, cols = 20, tileSize = 40;
        const maze = Array(rows).fill().map(() => Array(cols).fill(1));
        let frameCount = 0;

        const legend = document.getElementById("legend");
        const legendHeader = document.getElementById("legendHeader");
        const legendArrow = document.getElementById("legendArrow");

        legendHeader.addEventListener("click", () => {
            legend.classList.toggle("collapsed");
            legendArrow.textContent = legend.classList.contains("collapsed") ? "▼" : "▲";
        });

        const startAtTop = Math.random() < 0.5;
        const startRow = startAtTop ? 1 : rows - 2,
              endRow   = startAtTop ? rows - 2 : 1,
              startCol = 1,
              endCol   = cols - 2;

        function shuffle(a) {
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function generateMaze(r, c) {
            maze[r][c] = 0;
            for (const [dr, dc] of shuffle([[0,2],[0,-2],[2,0],[-2,0]])) {
                const nr = r + dr, nc = c + dc;
                if (nr > 0 && nr < rows - 1 && nc > 0 && nc < cols - 1 && maze[nr][nc] === 1) {
                    maze[r + dr / 2][c + dc / 2] = 0;
                    generateMaze(nr, nc);
                }
            }
        }

        generateMaze(startRow, startCol);
        maze[startRow][startCol] = 0;
        maze[endRow][endCol] = 0;

        const doors = [];

        function getMathProblem() {
            const max = maxDigit;
            let a = Math.floor(Math.random() * (max + 1));
            let b = Math.floor(Math.random() * (max + 1));
            const add = Math.random() < 0.5;
            if (!add && b > a) [a, b] = [b, a];
            return {
                question: add ? `${a} + ${b}` : `${a} - ${b}`,
                answer:   add ? a + b       :  a - b
            };
        }

        for (let i = 0; i < doorCount; i++) {
            let r, c;
            do {
                r = Math.floor(Math.random() * rows);
                c = Math.floor(Math.random() * cols);
            } while (
                maze[r][c] !== 0 ||
                (r === startRow && c === startCol) ||
                (r === endRow   && c === endCol)
            );
            const p = getMathProblem();
            doors.push({
                row: r,
                col: c,
                locked: true,
                aiUnlocked: false,
                question: p.question,
                answer: p.answer
            });
        }

        let player1 = { row: startRow, col: startCol, color: "#fde047" };
        let player2 = { row: startRow, col: startCol, color: "#38bdf8" };
        let ai      = { row: startRow, col: startCol, color: "#9d4edd" };
        let currentPlayer = 1, movesLeft = 0;

        // SCORE + FAILURE COUNTERS FOR LIVE LOGGING
        let p1Score = 0, p2Score = 0, aiScore = 0;
        let p1Fails = 0, p2Fails = 0;

        const dice1 = document.getElementById("dice1"),
              dice2 = document.getElementById("dice2"),
              rollButton = document.getElementById("rollButton"),
              movesBox = document.getElementById("movesBox");

        const doorModal = document.getElementById("doorModal");
        const doorQuestionEl = document.getElementById("doorQuestionText");
        const doorAnswerInput = document.getElementById("doorAnswerInput");
        const doorFeedbackEl = document.getElementById("doorFeedback");
        const doorSubmitBtn = document.getElementById("doorSubmitBtn");

        let doorModalOpen = false;
        let pendingDoor = null;

        // distance base for progress %
        const startDist = Math.abs(startRow - endRow) + Math.abs(startCol - endCol);

        function playerDistance(p) {
            return Math.abs(p.row - endRow) + Math.abs(p.col - endCol);
        }

        function computeProgressPercent() {
            const bestDist = Math.min(
                playerDistance(player1),
                playerDistance(player2),
                playerDistance(ai)
            );
            if (startDist === 0) return 100.0;
            const ratio = 1 - bestDist / startDist;
            return Math.max(0, Math.min(1, ratio)) * 100.0;
        }

        // simple "progress only" ping, any event name is fine
        function pushProgress() {
            sendGameUpdate({
                event: "progress",
                progress: computeProgressPercent()
            });
        }

        // initial log
        sendGameUpdate({
            event: "start",
            level: GAME_LEVEL,
            game_mode: "single",
            progress: 0.0,
        });

        function speakDoorQuestion(door) {
            try {
                const parts = door.question.split(" ");
                if (parts.length === 3) {
                    const [left, op, right] = parts;
                    const opWord = (op === "+") ? "plus" : "minus";
                    speak(`What is ${left} ${opWord} ${right}?`);
                } else {
                    speak(`What is ${door.question}?`);
                }
            } catch (e) {}
        }

        function openDoorModal(door, player, targetRow, targetCol) {
            pendingDoor = { door, player, targetRow, targetCol };
            doorQuestionEl.textContent = `${door.question} = ?`;
            doorAnswerInput.value = "";
            doorFeedbackEl.textContent = "";
            doorModal.classList.remove("hidden");
            doorModalOpen = true;
            doorAnswerInput.focus();
            speakDoorQuestion(door);
        }

        function closeDoorModal() {
            doorModal.classList.add("hidden");
            doorModalOpen = false;
            pendingDoor = null;
        }

        function handleDoorSubmit() {
            if (!pendingDoor) return;
            const val = parseInt(doorAnswerInput.value, 10);
            if (!Number.isFinite(val)) {
                doorFeedbackEl.textContent = "Please enter a number!";
                return;
            }

            const { door, player, targetRow, targetCol } = pendingDoor;
            const np = getMathProblem();

            const playerKey = (currentPlayer === 1 ? "player_one" : "player_two");

            if (val === door.answer) {
                doorFeedbackEl.textContent = "✅ Correct! Door unlocked.";
                speak("Good job, you may pass.");

                door.locked = false;
                player.row = targetRow;
                player.col = targetCol;
                door.question = np.question;
                door.answer = np.answer;

                if (currentPlayer === 1) p1Score++;
                else if (currentPlayer === 2) p2Score++;

                movesLeft--;
                updateMovesDisplay();
                drawMaze();

                // tell backend this player passed the door
                sendGameUpdate({
                    event: "door_attempt",
                    player: playerKey,
                    correct: true,
                    progress: computeProgressPercent()
                });

                setTimeout(() => {
                    closeDoorModal();

                    if (player.row === endRow && player.col === endCol) {
                        // final result for human players
                        sendGameUpdate({
                            event: "game_over",
                            winner: playerKey,
                            progress: 100.0
                        });
                        setTimeout(() => {
                            alert(`🎉 Player ${currentPlayer} won!`);
                            window.location.href = "{% url 'options' %}";
                        }, 150);
                        return;
                    }

                    if (movesLeft <= 0) {
                        setTimeout(() => {
                            switchTurn("no_moves");
                        }, 150);
                    }
                }, 600);
            } else {
                doorFeedbackEl.textContent = "❌ Wrong!";
                speak("Wrong answer, you lose a move.");

                if (currentPlayer === 1) p1Fails++;
                else if (currentPlayer === 2) p2Fails++;

                movesLeft--;
                updateMovesDisplay();
                door.question = np.question;
                door.answer = np.answer;

                drawMaze();

                // tell backend this player failed the door
                sendGameUpdate({
                    event: "door_attempt",
                    player: playerKey,
                    correct: false,
                    progress: computeProgressPercent()
                });

                setTimeout(() => {
                    closeDoorModal();
                    if (movesLeft <= 0) {
                        setTimeout(() => {
                            switchTurn("no_moves");
                        }, 150);
                    }
                }, 600);
            }
        }

        doorSubmitBtn.addEventListener("click", handleDoorSubmit);
        doorAnswerInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") handleDoorSubmit();
        });

        function updateMovesDisplay() {
            movesBox.textContent = movesLeft > 0 ? movesLeft : "0";
        }

        function drawMaze() {
            frameCount++;
            const grassGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            grassGrad.addColorStop(0, "#7ED957");
            grassGrad.addColorStop(1, "#55B84D");
            ctx.fillStyle = grassGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * tileSize, y = r * tileSize;
                    if (maze[r][c] === 1) {
                        const hedgeGrad = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
                        hedgeGrad.addColorStop(0, "#2F7D32");
                        hedgeGrad.addColorStop(0.5, "#1B5E20");
                        hedgeGrad.addColorStop(1, "#145214");
                        ctx.fillStyle = hedgeGrad;
                        ctx.fillRect(x, y, tileSize, tileSize);
                    } else {
                        const dirtGrad = ctx.createLinearGradient(x, y, x + tileSize, y + tileSize);
                        dirtGrad.addColorStop(0, "#A7E074");
                        dirtGrad.addColorStop(1, "#85C769");
                        ctx.fillStyle = dirtGrad;
                        ctx.fillRect(x, y, tileSize, tileSize);
                    }
                }
            }

            ctx.fillStyle = "#4ade80";
            ctx.fillRect(startCol * tileSize, startRow * tileSize, tileSize, tileSize);
            ctx.fillStyle = "#0ea5e9";
            ctx.fillRect(endCol * tileSize, endRow * tileSize, tileSize, tileSize);

            ctx.font = "bold 13px Comic Sans MS";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            for (const d of doors) {
                const x = d.col * tileSize, y = d.row * tileSize;
                ctx.fillStyle = d.locked ? "#9A3412" : "#22C55E";
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.strokeStyle = "#FFFFFF55";
                ctx.strokeRect(x, y, tileSize, tileSize);
                ctx.fillStyle = "white";
                ctx.fillText("Door", x + tileSize / 2, y + tileSize / 2);
            }

            const players = [player1, player2, ai];
            players.forEach((p, idx) => {
                if (idx + 1 !== currentPlayer) drawPlayer(p, false);
            });
            const activePlayer = players[currentPlayer - 1];
            drawPlayer(activePlayer, true);
        }

        function drawPlayer(p, isActive) {
            const x = p.col * tileSize + tileSize / 2;
            const y = p.row * tileSize + tileSize / 2;

            ctx.save();
            ctx.translate(x, y);

            if (isActive) ctx.scale(1.3, 1.3);

            const walk = Math.sin(frameCount / 5) * 3;

            ctx.fillStyle = p.color;
            ctx.fillRect(-3, -10, 6, 12);

            ctx.beginPath();
            ctx.arc(0, -15, 5, 0, Math.PI * 2);
            ctx.fillStyle = "#ffe5b4";
            ctx.fill();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = 1;
            ctx.stroke();

            ctx.strokeStyle = p.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-5, -6);
            ctx.lineTo(-10, -6 + walk);
            ctx.moveTo(5, -6);
            ctx.lineTo(10, -6 - walk);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-3, 2);
            ctx.lineTo(-5, 8 - walk);
            ctx.moveTo(3, 2);
            ctx.lineTo(5, 8 + walk);
            ctx.stroke();

            ctx.restore();
        }

        function sleep(ms) { return new Promise(res => setTimeout(res, ms)); }

        function switchTurn(reason = "normal") {
            currentPlayer = currentPlayer === 1 ? 2 : (currentPlayer === 2 ? 3 : 1);

            const icons = ["🟡", "🔵", "🤖"];
            document.getElementById("turnText").textContent =
                `Turn: Player ${currentPlayer} ${icons[currentPlayer - 1]}`;

            movesLeft = 0;
            updateMovesDisplay();
            rollButton.disabled = (currentPlayer === 3);

            drawMaze();

            if (currentPlayer === 3) {
                if (reason === "no_moves") {
                    speak("No more moves left. Now it is the A I's turn.");
                } else if (reason === "start") {
                    speak("A I's turn.");
                }
                runAITurn();
            } else {
                if (reason === "no_moves") {
                    speak(`No more moves left. Player ${currentPlayer}, roll the dice.`);
                } else {
                    speak(`Player ${currentPlayer}, roll the dice.`);
                }
            }
        }

        async function runAITurn() {
            await sleep(700);
            rollButton.disabled = true;

            let count = 0;
            const interval = setInterval(() => {
                dice1.textContent = Math.floor(Math.random() * 6) + 1;
                dice2.textContent = Math.floor(Math.random() * 6) + 1;
                count++;
            }, 100);

            await sleep(1000);
            clearInterval(interval);
            const final1 = Math.floor(Math.random() * 6) + 1;
            const final2 = Math.floor(Math.random() * 6) + 1;
            dice1.textContent = final1;
            dice2.textContent = final2;
            const aiRoll = final1 + final2;
            movesLeft = aiRoll;
            updateMovesDisplay();

            speak(`The A I rolled a ${aiRoll}.`);

            function findPath(startR, startC, endR, endC) {
                const queue = [[startR, startC]];
                const visited = Array(rows).fill().map(() => Array(cols).fill(false));
                const parent = {};
                visited[startR][startC] = true;

                const directions = [[1, 0], [-1, 0], [0, 1], [0, -1]];
                while (queue.length) {
                    const [r, c] = queue.shift();
                    if (r === endR && c === endC) break;

                    for (const [dr, dc] of directions) {
                        const nr = r + dr, nc = c + dc;
                        if (
                            nr >= 0 && nr < rows &&
                            nc >= 0 && nc < cols &&
                            maze[nr][nc] === 0 && !visited[nr][nc]
                        ) {
                            visited[nr][nc] = true;
                            parent[`${nr},${nc}`] = [r, c];
                            queue.push([nr, nc]);
                        }
                    }
                }

                const path = [];
                let cur = [endRow, endCol];
                while (cur && parent[`${cur[0]},${cur[1]}`]) {
                    path.unshift(cur);
                    cur = parent[`${cur[0]},${cur[1]}`];
                }
                return path;
            }

            const path = findPath(ai.row, ai.col, endRow, endCol);
            if (!path || path.length === 0) {
                speak("The A I could not find a path. Its turn is over.");
                switchTurn("ai_done");
                return;
            }

            let step = 0;
            while (movesLeft > 0 && step < path.length) {
                const [nr, nc] = path[step];
                const door = doors.find(d => d.row === nr && d.col === nc);

                if (door && !door.aiUnlocked) {
                    const doorRoll = Math.floor(Math.random() * 6) + 1;

                    if (doorRoll % 2 === 0) {
                        // AI passes the door (even roll) – VOICE ONLY
                        speak("A I passed the door.");
                        door.aiUnlocked = true;
                        if (door.locked) door.locked = false;

                        ai.row = nr;
                        ai.col = nc;
                        aiScore++;
                        movesLeft--;
                        updateMovesDisplay();
                        step++;

                        // log AI door success
                        sendGameUpdate({
                            event: "door_attempt",
                            player: "ai",
                            correct: true,
                            progress: computeProgressPercent()
                        });
                    } else {
                        // AI fails the door (odd roll) – VOICE ONLY
                        movesLeft--;
                        updateMovesDisplay();
                        speak("A I failed at the door. Minus one move.");
                        drawMaze();
                        await sleep(400);

                        // log AI door failure
                        sendGameUpdate({
                            event: "door_attempt",
                            player: "ai",
                            correct: false,
                            progress: computeProgressPercent()
                        });

                        if (movesLeft <= 0) break;
                    }
                } else {
                    ai.row = nr;
                    ai.col = nc;
                    movesLeft--;
                    updateMovesDisplay();
                    step++;

                    // optional progress-only update
                    pushProgress();
                }

                drawMaze();
                await sleep(400);

                if (ai.row === endRow && ai.col === endCol) {
                    // AI wins
                    sendGameUpdate({
                        event: "game_over",
                        winner: "ai",
                        progress: 100.0
                    });
                    speak("The A I reached the goal!");
                    alert("🎉 AI reached the goal!");
                    window.location.href = "{% url 'options' %}";
                    return;
                }
            }

            // AI turn finished (no more moves or path done)
            speak("A I's turn is done.");
            switchTurn("ai_done");
        }

        rollButton.addEventListener("click", () => {
            rollButton.disabled = true;
            const final1 = Math.floor(Math.random() * 6) + 1,
                  final2 = Math.floor(Math.random() * 6) + 1;
            let count = 0;
            const interval = setInterval(() => {
                dice1.textContent = Math.floor(Math.random() * 6) + 1;
                dice2.textContent = Math.floor(Math.random() * 6) + 1;
                count++;
            }, 100);
            setTimeout(() => {
                clearInterval(interval);
                dice1.textContent = final1;
                dice2.textContent = final2;
                movesLeft = final1 + final2;
                updateMovesDisplay();
                speak(`You rolled a ${movesLeft}.`);
                rollButton.disabled = false;
            }, 1000);
        });

        document.addEventListener("keydown", (e) => {
            if (doorModalOpen) return;
            if (movesLeft <= 0 || currentPlayer === 3) return;

            const p = currentPlayer === 1 ? player1 : player2;
            let nr = p.row, nc = p.col;
            if (e.key === "ArrowUp") nr--;
            else if (e.key === "ArrowDown") nr++;
            else if (e.key === "ArrowLeft") nc--;
            else if (e.key === "ArrowRight") nc++;
            else return;

            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && maze[nr][nc] === 0) {
                const door = doors.find(d => d.row === nr && d.col === nc);
                if (door) {
                    openDoorModal(door, p, nr, nc);
                    return;
                } else {
                    p.row = nr;
                    p.col = nc;
                    movesLeft--;
                    updateMovesDisplay();
                    drawMaze();
                    pushProgress();

                    if (p.row === endRow && p.col === endCol) {
                        const winnerKey = (currentPlayer === 1 ? "player_one" : "player_two");
                        sendGameUpdate({
                            event: "game_over",
                            winner: winnerKey,
                            progress: 100.0
                        });
                        setTimeout(() => {
                            alert(`🎉 Player ${currentPlayer} won!`);
                            window.location.href = "{% url 'options' %}";
                        }, 200);
                        return;
                    }
                    if (movesLeft <= 0) {
                        setTimeout(() => {
                            switchTurn("no_moves");
                        }, 150);
                    }
                }
            }
        });

        drawMaze();
        updateMovesDisplay();
        speak("Player 1, roll the dice.");
    </script>
</body>
